# Astron Collection — root Docker Compose stack.
#
# This is the single entry point for running Astron Collection from the repository root.
# It builds the root `Dockerfile` and exposes the dashboard in the browser.
#
# Exactly four services:
#
#   GROUP 1 — DATABASE   postgres   PostgreSQL, persistent storage of the platform
#   GROUP 2 — CACHE      redis      Redis, cache, BullMQ queues and coordination
#   GROUP 3 — FRONTEND   client     Next.js dashboard (SSR + /api/* proxy)
#   GROUP 4 — BACKEND    api        Backend: tRPC/OpenAPI, auth, WebSockets, workers
#
# There is no per-mode duplicate (`api-dev`, `client-dev`, …) and no sidecar: the
# mode is an environment of these four services, set by the `prod` or `dev` profile.
# Nothing here needs Traefik or Docker Swarm. The API does need the host Docker
# socket: it is a deployment manager and creates containers/networks for the
# applications launched from the dashboard.
#
# ---------------------------------------------------------------------------
# Profiles and environments
# ---------------------------------------------------------------------------
#   prod   docker compose --profile prod up -d --build    (default, COMPOSE_PROFILES)
#   dev    ASTRON_COLLECTION_MODE=development ASTRON_COLLECTION_BUILD_TARGET=dev \
#          NODE_ENV=development docker compose --profile dev up --build --watch
#
# `make docker-up [self|cloud]` and `make docker-dev [self|cloud]` set that whole
# environment for you — they are the supported entry points, because a Compose file
# cannot switch a service's build target from a profile.
#
# Each service belongs to both profiles and reads its mode from the environment:
#
#   ASTRON_COLLECTION_MODE          production | development (entrypoint behaviour)
#   ASTRON_COLLECTION_BUILD_TARGET  api | client (prod) or dev (hot reload)
#   NODE_ENV                        production | development
#
# `ASTRON_COLLECTION_BUILD_TARGET` therefore has a different default per service:
# unset means "build this service's production target", `dev` means "build the
# development stage", which ships the sources and dependencies the dev servers need.
#
# In development the client bind-mounts `apps/astron` and `packages` over the
# sources baked into the dev image, exactly like web/docker-compose.yml does for
# the website: `next dev` sees an edit the moment it is saved, with no `compose
# watch` process required and no copy delay. The image keeps its own node_modules
# and `.next/dev` (the Next development output), so host dependencies never
# shadow the Linux ones it installed.
# The API bind-mounts the same sources and runs `pnpm dev:api` (`tsx watch
# server/server.ts`), so a saved file is picked up by the watcher itself — no
# `develop.watch` restart loop. `pnpm dev` is the *frontend* script
# (`next dev --port 3000`) and must never be used for this role. Only a lockfile
# change rebuilds the image.
#
# Both modes publish the same ports, so they are mutually exclusive: stop one
# before starting the other with `make docker-down`.
#
# ---------------------------------------------------------------------------
# How the client talks to the API
# ---------------------------------------------------------------------------
# The browser calls the client origin. Next.js rewrites `/api/*` to `API_INTERNAL_URL`
# (the `api` service on the internal network), so session cookies stay first-party and
# the client never needs database or Redis credentials. WebSockets cannot be proxied by
# a rewrite: they connect straight to the published API port using
# NEXT_PUBLIC_API_URL (baked into the browser bundle at build time).
#
# Only the dashboard and API ports are published. PostgreSQL and Redis are reachable
# exclusively on the `astron-collection-internal` network.

name: astron-collection

# Shared backend configuration: the `api` service owns the credentials and the
# migrations, in both modes. The client inherits it because its pages render
# server-side (getServerSideProps + better-auth), but it runs no migration or worker.
x-api-environment: &api-environment
  NODE_ENV: ${NODE_ENV:-production}
  TZ: ${TZ:-UTC}
  # --- PostgreSQL ----------------------------------------------------------
  # `postgres` is the internal service name — never localhost from inside a container.
  DATABASE_URL: postgres://${POSTGRES_USER:-astron-collection}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}@postgres:5432/${POSTGRES_DB:-astron-collection}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  # --- Redis ---------------------------------------------------------------
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required — see .env.example}@redis:6379
  # --- Authentication ------------------------------------------------------
  # The API refuses to boot with a missing, short or well-known secret, so a
  # placeholder copied from .env.example stops the stack instead of shipping a
  # forgeable session cookie.
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required — see .env.example}
  # Auth callbacks and cookies must use the origin the browser actually visits.
  # localhost:3000 stays trusted for direct access.
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://dash.astron-collection.localhost}
  BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://dash.astron-collection.localhost,http://localhost:3000,http://127.0.0.1:3000}
  # --- Environment (self | cloud) -------------------------------------------
  # `self` is the self-hosted platform and `cloud` is Astron Manager Cloud. Both
  # run the same image and services: the environment only changes runtime
  # behaviour (IS_CLOUD and ASTRON_COLLECTION_PRODUCT), never the container
  # topology. Selected by the Makefile:
  #   make docker-up self | make docker-up cloud
  ASTRON_COLLECTION_FLAVOR: ${ASTRON_COLLECTION_FLAVOR:-selfhosted}
  ASTRON_COLLECTION_PRODUCT: ${ASTRON_COLLECTION_PRODUCT:-self}
  IS_CLOUD: ${IS_CLOUD:-false}
  # Browser-facing origin of the API, used for the WebSocket connection.
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
  # Legacy Templates gallery (inherited from Notploy): off by default. Both flags
  # must be true to re-enable it — this one gates the API, the NEXT_PUBLIC one
  # gates the dashboard bundle.
  ASTRON_COLLECTION_TEMPLATES_ENABLED: ${ASTRON_COLLECTION_TEMPLATES_ENABLED:-false}
  # --- Optional integrations (empty values disable them) -------------------
  OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
  OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
  OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
  OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
  OAUTH_DISCORD_CLIENT_ID: ${OAUTH_DISCORD_CLIENT_ID:-}
  OAUTH_DISCORD_CLIENT_SECRET: ${OAUTH_DISCORD_CLIENT_SECRET:-}

services:
  # -------------------------------------------------------------------------
  # GROUP 1 — DATABASE
  #
  # PostgreSQL 16, official image. No host port is published: only the services
  # attached to `astron-collection-internal` can reach it.
  # -------------------------------------------------------------------------
  postgres:
    profiles: ["prod", "dev"]
    image: postgres:16-alpine
    container_name: astron-collection-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astron-collection}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-astron-collection}
      # Deterministic encoding, independent from the host locale.
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF8}
    volumes:
      - astron-collection-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - astron-collection

  # -------------------------------------------------------------------------
  # GROUP 2 — CACHE / QUEUE
  #
  # Redis 7, official image. Cache, BullMQ queues and coordination. Append-only
  # persistence keeps queued jobs across a restart; the volume makes it durable.
  # Internal only: no host port is published.
  # -------------------------------------------------------------------------
  redis:
    profiles: ["prod", "dev"]
    image: redis:7-alpine
    container_name: astron-collection-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required — see .env.example}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - astron-collection-redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - astron-collection

  # -------------------------------------------------------------------------
  # GROUP 3 — FRONTEND
  #
  # Next.js dashboard. `next start` in production, `next dev` in development. Both
  # are the same platform image: `platform` is the production target, `dev` ships
  # the sources and dependencies the dev server watches. The target comes from
  # ASTRON_COLLECTION_BUILD_TARGET, the mode from ASTRON_COLLECTION_MODE.
  # -------------------------------------------------------------------------
  client:
    profiles: ["prod", "dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: ${ASTRON_COLLECTION_BUILD_TARGET:-platform}
      args:
        # Both services build the same image: keep the exact same args on `api`
        # so a later build cannot overwrite the self/cloud context of this one.
        # Baked into the browser bundle: origin used for the WebSocket connection.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_ASTRON_COLLECTION_TEMPLATES_ENABLED: ${NEXT_PUBLIC_ASTRON_COLLECTION_TEMPLATES_ENABLED:-false}
        ASTRON_COLLECTION_VERSION: ${ASTRON_COLLECTION_VERSION:-latest}
    # The same image as `api`: the edition (self | cloud) picks the tag,
    # the role decides what the container runs.
    image: ${ASTRON_COLLECTION_IMAGE:-ghcr.io/skygenesisenterprise/astron-manager}:${ASTRON_COLLECTION_VERSION:-latest}
    container_name: astron-collection-client
    restart: unless-stopped
    environment:
      # The dashboard renders pages server-side: getServerSideProps queries the
      # database and better-auth validates sessions, so the client needs the same
      # backend configuration as the API. It still runs no migrations/worker.
      <<: *api-environment
      NODE_ENV: ${NODE_ENV:-production}
      # Selects the frontend role in the shared entrypoint.
      ASTRON_COLLECTION_ROLE: client
      ASTRON_COLLECTION_MODE: ${ASTRON_COLLECTION_MODE:-production}
      PORT: 3000
      HOST: 0.0.0.0
      TZ: ${TZ:-UTC}
      # Server-side proxy target for `/api/*`. Internal service name, never localhost.
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_TELEMETRY_DISABLED: "1"
      # Polling, not inotify: file events raised on the host do not reach the
      # container's watcher through the bind mount, so `next dev` kept serving its
      # first compilation after every edit. Polling is inert in production.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      # Host port is configurable; the container always listens on 3000.
      - "${ASTRON_COLLECTION_PORT:-3000}:3000"
      # Also served on port 80 so the dashboard is reachable at
      # http://dash.astron-collection.localhost: browsers resolve every *.localhost
      # name to loopback (RFC 6761), so no /etc/hosts entry is needed.
      - "${ASTRON_COLLECTION_DASH_PORT:-80}:3000"
    depends_on:
      api:
        # The client is an independent Next.js process: in development it must
        # not wait for the API healthcheck, which stays pending while Next
        # compiles its first route. It proxies /api/* once the API is up.
        condition: service_started
    healthcheck:
      # Role-aware probe baked into the image (entrypoint.sh healthcheck): the
      # client only checks that port 3000 accepts TCP connections (no HTTP GET,
      # no `/login` request), the API checks `/api/health`.
      test: ["CMD", "/usr/local/bin/entrypoint.sh", "healthcheck"]
      interval: 30s
      # Development roles compile Next.js routes on first request, which can
      # exceed 10s on a cold container and kept the client from ever starting.
      timeout: 30s
      retries: 10
      start_period: 180s
    volumes:
      # Development hot reload — the sources are bind-mounted from the host, so
      # `next dev` sees a saved edit immediately. `develop.watch` + `sync` copied
      # files on its own schedule and only while `--watch` was running, which is
      # why the preview lagged or stayed stale. A bind mount needs no extra
      # process: a plain `up` is enough.
      #
      # These paths only exist in the `dev` build target; the production target
      # runs from `/app` and never reads `/usr/src/app`, so the mounts are inert
      # there.
      - ./apps/astron:/usr/src/app/apps/astron
      - ./packages:/usr/src/app/packages
      # Dependencies and dev build state stay owned by the image: the host
      # node_modules holds native modules built for another platform. Anonymous
      # volumes are initialised from the image, so pnpm's symlinks keep
      # resolving in it.
      - /usr/src/app/apps/astron/node_modules
      # The app writes runtime state (Traefik config, logs, SSH keys) to
      # `.docker/` as root. Keep it in a volume instead of the bind-mounted
      # source tree, so it never leaks root-owned 0700 dirs into the build
      # context and breaks the next `docker compose build`.
      - astron-collection-config:/usr/src/app/apps/astron/.docker
      # Next separates the outputs: `next dev` writes to `.next/dev` while
      # `next build` keeps `.next`. Mount exactly the development subtree, so the
      # dev server owns its compilation cache and never picks up a stale host
      # `.next` (or another platform's production build) through the bind mount.
      - /usr/src/app/apps/astron/.next/dev
    develop:
      # Code changes are live through the bind mount above; only a lockfile change
      # needs a rebuild of the dev image.
      watch:
        - action: rebuild
          path: pnpm-lock.yaml
    networks:
      - astron-collection

  # -------------------------------------------------------------------------
  # GROUP 4 — BACKEND
  #
  # Node server: tRPC and OpenAPI routes, better-auth, WebSockets, BullMQ workers
  # and cron jobs. It owns both dependency connections and closes them on SIGTERM.
  # Same image as `client` (`ASTRON_COLLECTION_IMAGE`), role `api`: the backend
  # entry point `apps/astron/server/server.ts` imports `@astron-collection/server`
  # (packages/server). It runs as `node dist/server.mjs` in production or
  # `pnpm dev:api` (`tsx watch server/server.ts`) in development — selected by
  # ASTRON_COLLECTION_MODE, never ASTRON_COLLECTION_BUILD_TARGET. It listens on
  # PORT=4000 and is the only process that applies migrations.
  #
  # It is the only service with PostgreSQL and Redis credentials, and the only one
  # that applies migrations: once at startup (ASTRON_COLLECTION_RUN_MIGRATIONS=1,
  # the default) so a deployment never starts against a stale schema. Scaling the
  # API horizontally means setting that to 0 and running `make migrate` once.
  # -------------------------------------------------------------------------
  api:
    profiles: ["prod", "dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: ${ASTRON_COLLECTION_BUILD_TARGET:-platform}
      args:
        # Identical to `client`: one shared `astron-manager` image, no drift.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_ASTRON_COLLECTION_TEMPLATES_ENABLED: ${NEXT_PUBLIC_ASTRON_COLLECTION_TEMPLATES_ENABLED:-false}
        ASTRON_COLLECTION_VERSION: ${ASTRON_COLLECTION_VERSION:-latest}
        ASTRON_COLLECTION_FLAVOR: ${ASTRON_COLLECTION_FLAVOR:-selfhosted}
        ASTRON_COLLECTION_PRODUCT: ${ASTRON_COLLECTION_PRODUCT:-self}
    image: ${ASTRON_COLLECTION_IMAGE:-ghcr.io/skygenesisenterprise/astron-manager}:${ASTRON_COLLECTION_VERSION:-latest}
    container_name: astron-collection-api
    restart: unless-stopped
    volumes:
      # The API creates networks, containers and services for the applications
      # deployed from the dashboard: without this mount it logs ENOENT
      # /var/run/docker.sock and deployment management cannot work.
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      # Development hot reload (inert in production): mount the same sources as
      # the client. This is also what gives the API the workspace packages'
      # built `dist/` (e.g. @astron-collection/react/styles.css), which
      # .dockerignore excludes from the image. Without it, /api/health and every
      # /api/trpc/* call fail with "Module not found ... styles.css".
      - ./apps/astron:/usr/src/app/apps/astron
      - ./packages:/usr/src/app/packages
      # Dependencies and Next dev output stay owned by the image/container: the
      # host's native modules and build cache must never shadow the Linux ones.
      - /usr/src/app/apps/astron/node_modules
      - /usr/src/app/apps/astron/.next/dev
      - astron-collection-config:/usr/src/app/apps/astron/.docker
    environment:
      <<: *api-environment
      # Selects the backend role in the shared entrypoint.
      ASTRON_COLLECTION_ROLE: api
      ASTRON_COLLECTION_MODE: ${ASTRON_COLLECTION_MODE:-production}
      # Single API instance: it owns the migrations of this deployment.
      ASTRON_COLLECTION_RUN_MIGRATIONS: ${ASTRON_COLLECTION_RUN_MIGRATIONS:-1}
      # Deployment engine: make the host daemon explicit instead of relying on
      # dockerode's host probing (read-only would break every deployment).
      DOCKER_HOST: unix:///var/run/docker.sock
      PORT: 4000
      HOST: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: ${DEV_POLLING:-false}
      WATCHPACK_POLLING: ${DEV_POLLING:-false}
    ports:
      # Published so the browser can open the WebSocket connection (and for API clients).
      - "${ASTRON_COLLECTION_API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Role-aware probe baked into the image (entrypoint.sh healthcheck).
      test: ["CMD", "/usr/local/bin/entrypoint.sh", "healthcheck"]
      interval: 30s
      # Development roles compile Next.js routes on first request, which can
      # exceed 10s on a cold container and kept the client from ever starting.
      timeout: 30s
      retries: 10
      start_period: 180s
    develop:
      # Hot reload is handled by `pnpm dev:api` (`tsx watch`) over the bind mounts
      # above. Do NOT add `action: restart` rules here: the API writes runtime
      # files (Traefik configs, logs, SSH keys) on every boot, and a watcher would
      # treat them as source changes and restart the container in a loop. Those
      # files now live in the `astron-collection-config` volume. Only a lockfile
      # change needs a rebuild.
      watch:
        - action: rebuild
          path: pnpm-lock.yaml
    networks:
      - astron-collection

volumes:
  # Application data. Deleting these volumes destroys the database and the queued
  # jobs; `docker compose down` alone preserves them.
  astron-collection-postgres-data:
    name: astron-collection-postgres-data
  astron-collection-redis-data:
    name: astron-collection-redis-data
  # Runtime config written by the app (Traefik files, logs, SSH keys). Kept out
  # of the bind-mounted source tree so the Docker build context stays readable.
  astron-collection-config:
    name: astron-collection-config

networks:
  # Single internal bridge network. PostgreSQL and Redis are reachable only through
  # it; it is not `internal: true` because the API needs outbound access (git
  # providers, OAuth, AI providers, notifications).
  astron-collection:
    name: astron-collection-internal
    driver: bridge
