services:
  protect:
    build:
      context: ../..
      dockerfile: bot/protect/Dockerfile
    image: ${ASTRON_BOT_IMAGE:-ghcr.io/skygenesisenterprise/protect}:${ASTRON_BOT_VERSION:-latest}
    container_name: protect-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      ASTRON_DATA_DIR: /app/bot/protect/data
      ASTRON_HEALTH_PORT: "8080"
    volumes:
      - protect-data:/app/bot/protect/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  protect-data:
    name: protect-data
