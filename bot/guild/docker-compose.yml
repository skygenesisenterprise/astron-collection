name: astron-guild

services:
  guild:
    build:
      context: ../..
      dockerfile: bot/guild/Dockerfile
    image: ghcr.io/skygenesisenterprise/astron/guild:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASTRON_HEALTH_PORT: "3013"
      ASTRON_DATABASE_PATH: /app/bot/guild/data/guild.sqlite3
    ports:
      - "3013:3013"
    volumes:
      - guild-data:/app/bot/guild/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3013/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  guild-data:
