services:
  logger:
    build:
      context: ../..
      dockerfile: bot/logger/Dockerfile
    image: ${ASTRON_BOT_IMAGE:-ghcr.io/skygenesisenterprise/astron-logger}:${ASTRON_BOT_VERSION:-latest}
    container_name: logger-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      ASTRON_DATA_DIR: /app/bot/logger/data
      ASTRON_HEALTH_PORT: "8080"
    volumes:
      - logger-data:/app/bot/logger/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  logger-data:
    name: logger-data
