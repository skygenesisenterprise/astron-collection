services:
  redis:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --loglevel
      - warning
      - --save
      - "60"
      - "1"
      - --requirepass
      - ${REDIS_PASSWORD:-redis-default-password}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-default-password}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - redis:/data
    expose:
      - "6379"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
    image: astron-collection/astron-player:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: bot
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_WELCOME_DM_ENABLED: ${DISCORD_WELCOME_DM_ENABLED:-true}
      DISCORD_COMMAND_SCOPE: ${DISCORD_COMMAND_SCOPE:-global}
      DISCORD_ANNOUNCE_DEPLOYMENTS: ${DISCORD_ANNOUNCE_DEPLOYMENTS:-true}
      REDIS_ENABLED: "true"
      REDIS_REQUIRED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-default-password}
      REDIS_DB: "0"
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis-default-password}@redis:6379/0
      REDIS_KEY_PREFIX: astron-player:v1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - bot-data:/app/bot/data

volumes:
  redis:
  bot-data:
