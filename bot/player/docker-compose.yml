# Player — one image, one process, one volume. ffmpeg and yt-dlp are embedded in
# the image, so playback needs no sidecar.
name: astron-player

services:
  player:
    build:
      context: ../..
      dockerfile: bot/player/Dockerfile
      args:
        ASTRON_COLLECTION_VERSION: ${ASTRON_COLLECTION_VERSION:-2.0.0}
    image: ${ASTRON_BOT_IMAGE:-ghcr.io/skygenesisenterprise/astron-player}:${ASTRON_BOT_VERSION:-latest}
    container_name: player-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_VERSION: ${ASTRON_COLLECTION_VERSION:-2.0.0}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      ASTRON_LOG_LEVEL: ${ASTRON_LOG_LEVEL:-info}
      ASTRON_DATA_DIR: /app/bot/player/data
      ASTRON_DATABASE_PATH: /app/bot/player/data/player.sqlite3
      ASTRON_HEALTH_PORT: "3015"
      ASTRON_DEPLOY_COMMANDS: ${ASTRON_DEPLOY_COMMANDS:-false}
      ASTRON_YTDLP_PATH: /usr/local/bin/yt-dlp
      ASTRON_EVENT_URL: ${ASTRON_EVENT_URL:-}
      ASTRON_EVENT_SECRET: ${ASTRON_EVENT_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3015:3015"
    develop:
      watch:
        - action: sync
          path: .
          target: /app/bot/player
          ignore:
            - .env
            - data/
            - node_modules/
        - action: rebuild
          path: ../../packages/discord-framework
    volumes:
      - player-data:/app/bot/player/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3015/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  player-data:
