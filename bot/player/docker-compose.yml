name: astron-player

services:
  player:
    build:
      context: ../..
      dockerfile: bot/player/Dockerfile
    image: ghcr.io/skygenesisenterprise/astron/player:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASTRON_HEALTH_PORT: "3015"
      ASTRON_DATABASE_PATH: /app/bot/player/data/player.sqlite3
      ASTRON_YTDLP_PATH: /usr/local/bin/yt-dlp
    ports:
      - "3015:3015"
    volumes:
      - player-data:/app/bot/player/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3015/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  player-data:
