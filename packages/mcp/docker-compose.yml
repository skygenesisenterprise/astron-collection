services:
  astron-collection-mcp-http:
    build:
      context: ../..
      dockerfile: packages/mcp/Dockerfile
    container_name: astron-collection-mcp-http
    ports:
      - "${EXTERNAL_PORT:-3000}:3000"
    environment:
      - MCP_TRANSPORT=${MCP_TRANSPORT:-http}
      # Required: the remote transport refuses to start without a bearer token.
      - ASTRON_COLLECTION_MCP_HTTP_TOKEN=${ASTRON_COLLECTION_MCP_HTTP_TOKEN:?set ASTRON_COLLECTION_MCP_HTTP_TOKEN}
      - ASTRON_COLLECTION_MCP_HTTP_HOST=0.0.0.0
      - ASTRON_COLLECTION_URL=${ASTRON_COLLECTION_URL:-https://your-astron-collection-server.com}
      - ASTRON_COLLECTION_API_KEY=${ASTRON_COLLECTION_API_KEY:-your_token_here}
      - ASTRON_COLLECTION_MCP_MODE=${ASTRON_COLLECTION_MCP_MODE:-business}
      - ASTRON_COLLECTION_MCP_ENVIRONMENT=${ASTRON_COLLECTION_MCP_ENVIRONMENT:-self}
      # Optional operator approval for high-impact capabilities.
      - ASTRON_COLLECTION_MCP_APPROVAL_TOKEN=${ASTRON_COLLECTION_MCP_APPROVAL_TOKEN:-}
      # Persist long-running operations and the audit trail on a volume.
      - ASTRON_COLLECTION_MCP_OPERATION_STORE=/data/operations.json
      - ASTRON_COLLECTION_MCP_AUDIT_LOG=/data/audit.jsonl
    volumes:
      - mcp-data:/data
    restart: unless-stopped
    networks:
      - mcp-network

  astron-collection-mcp-stdio:
    build:
      context: ../..
      dockerfile: packages/mcp/Dockerfile
    container_name: astron-collection-mcp-stdio
    environment:
      - ASTRON_COLLECTION_URL=${ASTRON_COLLECTION_URL:-https://your-astron-collection-server.com}
      - ASTRON_COLLECTION_API_KEY=${ASTRON_COLLECTION_API_KEY:-your_token_here}
      - ASTRON_COLLECTION_MCP_MODE=${ASTRON_COLLECTION_MCP_MODE:-business}
    restart: "no"
    stdin_open: true
    tty: true
    networks:
      - mcp-network

volumes:
  mcp-data:

networks:
  mcp-network:
    driver: bridge
